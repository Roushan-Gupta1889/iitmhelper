<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — IITM Helper</title>
    <link rel="icon" type="image/png" href="/assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #080c14;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(139,92,246,0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 20%, rgba(236,72,153,0.06) 0%, transparent 55%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            padding: 2rem;
            text-align: center;
        }

        .offline-card {
            background: rgba(15,23,42,0.8);
            border: 1px solid rgba(139,92,246,0.2);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .offline-card::before {
            content: '';
            position: absolute;
            top: -1px; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #8b5cf6, #ec4899, transparent);
        }

        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f9a8d4, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.75rem;
        }

        p {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .cached-pages {
            text-align: left;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 2rem;
        }
        .cached-pages h3 {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #475569;
            margin-bottom: 0.75rem;
        }
        .cached-pages ul { list-style: none; }
        .cached-pages li { margin-bottom: 0.4rem; }
        .cached-pages a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }
        .cached-pages a:hover { color: #f9a8d4; }
        .cached-pages a::before { content: '→'; color: #475569; }

        .retry-btn {
            background: linear-gradient(135deg, #7c3aed, #be185d);
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(124,58,237,0.4);
            width: 100%;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(124,58,237,0.5);
        }

        .logo {
            font-size: 1rem;
            font-weight: 800;
            color: white;
            margin-top: 2rem;
            letter-spacing: 0.02em;
        }
        .logo span {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <span class="offline-icon">📡</span>
        <h1>You're Offline</h1>
        <p>No internet connection detected. Some pages are available from your cache — or try again when you're back online.</p>

        <div class="cached-pages">
            <h3>Available Offline</h3>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/pages/gpa-calculator.html">GPA Calculator</a></li>
                <li><a href="/pages/course-selection.html">Course Selection</a></li>
                <li><a href="/pages/studyplus-yt.html">StudyPlus YT</a></li>
                <li><a href="/pages/diploma-pathways.html">Diploma Pathways</a></li>
                <li><a href="/pages/ai-assistant.html">AI Assistant</a></li>
            </ul>
        </div>

        <button class="retry-btn" onclick="window.location.reload()">
            🔄 Retry Connection
        </button>

        <div class="logo">IITM <span>HELPER</span></div>
    </div>
</body>
</html>
